name: tmp-agentdock-stdin-ci

on:
  push:
    branches:
      - tmp/agentdock-stdin-reliability-20261001
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Go version
        run: go version
      - name: Command package tests
        run: go test ./internal/tool/command -count=1 -v
      - name: Full repository tests
        run: go test ./... -count=1

  canary_asset:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Windows canary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          go build -trimpath -o dist/agentdock.exe ./cmd/agentdock
          Compress-Archive -Path dist/agentdock.exe -DestinationPath dist/agentdock-stdin-canary-win-amd64.zip -Force
          Get-FileHash dist/agentdock-stdin-canary-win-amd64.zip -Algorithm SHA256
      - name: Publish temporary prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tmp-agentdock-stdin-canary-20261001 --cleanup-tag --yes 2>$null
          gh release create tmp-agentdock-stdin-canary-20261001 dist/agentdock-stdin-canary-win-amd64.zip --target "${{ github.sha }}" --prerelease --title "Temporary AgentDock stdin canary" --notes "Temporary canary artifact for H00 validation. Not a production release."
